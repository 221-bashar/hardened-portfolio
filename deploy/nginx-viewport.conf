server {
    server_name basharkhatib.me;

    root /var/www/viewport;
    index index.html;
    server_tokens off;

    location = /php/config.php { deny all; }
    location ^~ /db/          { deny all; }
    location ~ /\.            { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/basharkhatib.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/basharkhatib.me/privkey.pem; # managed by Certbot
    include snippets/security-headers.conf;
    include snippets/contact-ratelimit.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = basharkhatib.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name basharkhatib.me;
    return 404; # managed by Certbot


}